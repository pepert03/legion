[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legion"
version = "0.1.0"
description = "Coordination of many AI agents on one git repository, with no central server"
requires-python = ">=3.10"
dependencies = ["cryptography>=41"]

[project.scripts]
legion = "legion.cli:main"

[tool.setuptools.packages.find]
include = ["legion*"]

[tool.setuptools.package-data]
legion = ["templates/*.md", "templates/*.html", "static/logos/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
