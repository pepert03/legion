name: legion verifier

# A node that only verifies, for a project whose own machines aren't always on. It joins the project named in this
# repository's variable LEGION_PROJECT (a Radicle id, rad:...), or catches up with it, and then, every 20 minutes for
# nearly six hours, checks the patches waiting for a verdict exactly as any agent's `python -m legion verify` does,
# and signs what it found. Its first step queues the next run, which waits (the concurrency group) and starts the
# moment this one ends, however it ends. In Erdős #902 the only machine with Lean that could verify another owner's
# patches was a laptop.
#
# Why each run queues the next at its start: GitHub's schedule fired not once in the first two hours of this workflow
# on main (22 Nov 2026). A run that started its successor as its last step stopped the chain when GitHub ended it with
# "an internal error" fifteen minutes in, before that step. And a keeper on `workflow_run` doesn't fire for runs that
# a workflow's own token started, which every run after the first is. A run started by that token does start
# (workflow_dispatch is the exception to "events of GITHUB_TOKEN start no runs"), and one queued at the start of a
# run is there whatever happens to it. The schedule and verifier-keeper.yml stay, to start the chain again if it
# ever breaks. A run that ends before LEGION_VERIFIER_GAP seconds (20 minutes) waits that long, so a broken setup
# is tried three times an hour, not without pause.
#
# It needs, set once in the repository (Settings > Secrets and variables > Actions):
#   secret   LEGION_IDENTITY  the verifier's legion identity: its file in ~/.legion/identities, whole
#   secret   RAD_PROFILE      its Radicle node's keys and config: `tar -cz keys config.json | base64`, from a RAD_HOME
#   variable LEGION_PROJECT   the project's Radicle id
#   variable LEGION_SETUP     optional: the project's one-time setup in a clone (`python check.py --setup`)
#   variable LEGION_VERIFIER  optional: `off` stops it (the run under way goes on; no other is started)
#   variable LEGION_VERIFIER_MINUTES  optional: how long a run goes on verifying (default 330)
# Its verifications count once the project trusts it: an owner vouches for it as a subagent
# (`python -m legion delegate <its name>`), or it earns it like any agent.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long this run goes on verifying before it starts the next (default 330: 5 h 30 min)"
        required: false
        default: ""
  schedule:
    - cron: "7 */2 * * *"

concurrency:
  group: legion-verifier
  cancel-in-progress: false

permissions:
  contents: read
  actions: write  # to queue the next run

jobs:
  verify:
    if: vars.LEGION_PROJECT != '' && vars.LEGION_VERIFIER != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      LEGION_PROJECT: ${{ vars.LEGION_PROJECT }}
      LEGION_SETUP: ${{ vars.LEGION_SETUP }}
      LEGION_AGENT: github-actions
      LEGION_VERIFY_INLINE: "1"
      # Every command also takes from the node's storage what came by Radicle, not only what the relays hold: a
      # runner's clone read the relays alone, missed events no relay had, worked out an older main than the
      # project's, and (rightly) judged nothing.
      LEGION_RADICLE: always
      CLONE: /home/runner/project
      EVERY: "1200"        # seconds between the starts of two cycles
      # Minutes after the run started past which no cycle starts: 330 (5 h 30 min), or what whoever started it asked.
      CYCLES_MINUTES: ${{ inputs.minutes || vars.LEGION_VERIFIER_MINUTES || '330' }}
      GAP: ${{ vars.LEGION_VERIFIER_GAP || '1200' }}
    steps:
      - name: Start
        run: echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Queue the next run
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run verifier.yml --repo "$GITHUB_REPOSITORY" --ref main && echo "next run queued"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install this legion
        run: python -m pip install -q .

      # Never in a cache: a pull request's workflow can read the caches of the branch it targets.
      - name: Keys
        env:
          LEGION_IDENTITY: ${{ secrets.LEGION_IDENTITY }}
          RAD_PROFILE: ${{ secrets.RAD_PROFILE }}
        run: |
          set -eu
          if [ -z "$LEGION_IDENTITY" ] || [ -z "$RAD_PROFILE" ]; then
            echo "::error::set the secrets LEGION_IDENTITY and RAD_PROFILE (see the top of this file)"; exit 1
          fi
          mkdir -p ~/.radicle ~/.legion/identities
          printf '%s' "$RAD_PROFILE" | base64 -d | tar -xz -C ~/.radicle
          chmod 700 ~/.radicle/keys && chmod 600 ~/.radicle/keys/radicle
          umask 077
          printf '%s' "$LEGION_IDENTITY" > ~/.legion/incoming.json
          python - <<'EOF'
          import os
          from pathlib import Path
          from legion.identity import Identity
          src = Path.home() / ".legion" / "incoming.json"
          ident = Identity.load(src)
          ident.save()
          src.unlink()
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"LEGION_ID={ident.key_id}\n")
          print(f"verifying as {ident.name} ({ident.short})")
          EOF

      # The project's clone, the node's storage and Lean are what takes minutes to get: kept between runs, a new
      # copy four times a day.
      - name: Cache slot
        id: slot
        run: echo "slot=$(date -u +%Y%m%d)-$(( $(date -u +%-H) / 6 ))" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.radicle/storage
            ~/.radicle/node/*.db*
            ~/project
            ~/.elan
          key: legion-verifier-${{ steps.slot.outputs.slot }}
          restore-keys: legion-verifier-

      - name: Radicle
        run: |
          # With a storage brought back from the cache the node takes a while to come up, longer than
          # `rad node start` waits for it: it's given time, and asked again.
          python -m legion radicle setup || true
          export PATH="$HOME/.radicle/bin:$PATH"
          echo "$HOME/.radicle/bin" >> "$GITHUB_PATH"
          for i in $(seq 1 30); do
            if RAD_PASSPHRASE="" rad node status 2>/dev/null | grep -q "is running"; then break; fi
            sleep 10
          done
          sleep 20  # a node that has just started is still finding the seeds
          python -m legion radicle setup | tail -n 2

      - name: Join the project, or catch up with it
        run: |
          set -eu
          if [ -d "$CLONE/.git" ]; then
            cd "$CLONE"
            # The storage is as old as its cache: bring this node's signed refs to where the seeds have them.
            python -m legion heal || true
          else
            python -m legion join "$LEGION_PROJECT" "$CLONE" --identity "$LEGION_ID" --no-viz
          fi
          cd "$CLONE"
          # A runner has another address every run, and nobody connects to it: it doesn't announce one.
          git config legion.tunnel off
          python -m legion status | tail -n 12

      - name: Lean
        run: |
          set -eu
          cd "$CLONE"
          if [ -f lean-toolchain ]; then
            if [ ! -x "$HOME/.elan/bin/elan" ]; then
              curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
            fi
            echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.elan/bin:$PATH"
          fi
          if [ -n "$LEGION_SETUP" ]; then $LEGION_SETUP; fi

      # A SAT solver and a proof checker for the agents whose machines have none (`legion sat FILE`), at pinned
      # commits (kissat rel-4.0.4, drat-trim of 2024-11-25), built once and kept.
      - uses: actions/cache@v4
        with:
          path: ~/sat
          key: legion-sat-kissat-8af8e56f-drat-trim-2e3b2dc0

      - name: SAT
        continue-on-error: true  # without a solver the verifier verifies all the same
        run: |
          set -eu
          mkdir -p "$HOME/sat"
          if [ ! -x "$HOME/sat/kissat" ]; then
            git clone -q https://github.com/arminbiere/kissat /tmp/kissat
            git -C /tmp/kissat checkout -q 8af8e56f174b778aef3aa45af9f739b2a5f492c2
            (cd /tmp/kissat && ./configure > /dev/null && make -j4 > /dev/null)
            cp /tmp/kissat/build/kissat "$HOME/sat/"
          fi
          if [ ! -x "$HOME/sat/drat-trim" ]; then
            git clone -q https://github.com/marijnheule/drat-trim /tmp/drat-trim
            git -C /tmp/drat-trim checkout -q 2e3b2dc0ecf938addbd779d42877b6ed69d9a985
            make -C /tmp/drat-trim > /dev/null
            cp /tmp/drat-trim/drat-trim "$HOME/sat/"
          fi
          echo "$HOME/sat" >> "$GITHUB_PATH"
          echo "kissat $("$HOME/sat/kissat" --version), drat-trim ready"

      - name: Verify every 20 minutes
        run: |
          cd "$CLONE"
          python - <<'EOF'
          import json
          import os
          import subprocess
          import sys
          import time

          started, every = float(os.environ["STARTED"]), int(os.environ["EVERY"])
          until = int(os.environ["CYCLES_MINUTES"]) * 60
          cycle, total = 0, 0
          while cycle == 0 or time.time() - started < until:  # always one cycle, however short the run asked for
              cycle += 1
              t0, done = time.time(), 0
              while time.time() - t0 < every - 120:  # one cycle's checks end before the next starts
                  p = subprocess.run([sys.executable, "-m", "legion", "verify", "--json", "--timeout", "1500"],
                                     capture_output=True, text=True)
                  last = {}
                  for line in p.stdout.splitlines():
                      try:
                          last = json.loads(line) if line.startswith("{") else last
                      except ValueError:
                          pass
                  print(json.dumps(last), flush=True)
                  if p.returncode or not last.get("verified"):
                      if p.returncode:
                          print(p.stdout[-3000:], p.stderr[-3000:], sep="\n", flush=True)
                      break
                  done += 1
              total += done
              # Lean for the agents whose machines have none (`legion lean FILE`): what they asked, compiled here.
              try:
                  q = subprocess.run([sys.executable, "-m", "legion", "lean", "--serve"], capture_output=True,
                                     text=True, timeout=max(600, every - (time.time() - t0)))
                  print(q.stdout[-1500:], q.stderr[-800:], sep="\n", flush=True)
              except subprocess.TimeoutExpired:
                  print("lean --serve ran out of this cycle's time", flush=True)
              # And a SAT problem (`legion sat FILE`), one a cycle: solving and checking its proof can take hours,
              # each bounded by the time its asker asked for.
              try:
                  q = subprocess.run([sys.executable, "-m", "legion", "sat", "--serve"], capture_output=True,
                                     text=True, timeout=3 * 3600)
                  print(q.stdout[-1500:], q.stderr[-800:], sep="\n", flush=True)
              except subprocess.TimeoutExpired:
                  print("sat --serve ran over three hours", flush=True)
              print(f"{time.strftime('%H:%M:%S', time.gmtime())} UTC cycle {cycle}: verified {done}; "
                    f"waiting: {last.get('waiting', '?')}, passed over: {last.get('skipped') or {}}", flush=True)
              left = every - (time.time() - t0)
              if time.time() - started + max(left, 0) >= until:
                  break
              time.sleep(max(left, 0))
          print(f"verified {total} patch(es) in {cycle} cycle(s)")
          EOF

      - name: What it left
        if: always()
        run: |
          cd "$CLONE" 2>/dev/null || exit 0
          python -m legion relay | tail -n 8 || true
          python -m legion log --no-sync | tail -n 6 || true

      - name: Pace
        if: always()
        run: |
          ran=$(( $(date +%s) - STARTED ))
          if [ "$ran" -lt "$GAP" ]; then echo "ran ${ran} s: waiting until ${GAP} s"; sleep $(( GAP - ran )); fi
